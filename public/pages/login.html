<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Farmers Direct</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="/" class="logo">🌱 Farmers Direct</a>
    <ul id="nav-links"></ul>
  </nav>

  <!-- LOGIN FORM -->
  <div class="form-container">
    <h2>Welcome Back</h2>

    <div id="alert-box"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" />
    </div>

    <button class="btn btn-green" onclick="login()">Login</button>

    <div class="form-footer">
      Don't have an account? <a href="/pages/register.html">Register here</a>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    updateNavbar();

    async function login() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showAlert('alert-box', 'Email and password are required.', 'error');
        return;
      }

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          saveToken(data.token);
          saveUser(data.user);
          showAlert('alert-box', 'Login successful! Redirecting...', 'success');

          setTimeout(() => {
            if (data.user.role === 'farmer') {
              window.location.href = '/pages/farmer-dashboard.html';
            } else {
              window.location.href = '/pages/products.html';
            }
          }, 1000);

        } else {
          showAlert('alert-box', data.message, 'error');
        }

      } catch (err) {
        showAlert('alert-box', 'Something went wrong. Please try again.', 'error');
      }
    }
  </script>

</body>
</html>
