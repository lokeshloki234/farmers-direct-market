<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders - Farmers Direct</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="/" class="logo">🌱 Farmers Direct</a>
    <ul id="nav-links"></ul>
  </nav>

  <div class="container">
    <h2 class="page-title">My Orders</h2>
    <div id="orders-container">Loading...</div>
  </div>

  <footer>
    <p>© 2024 Farmers Direct Market</p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    updateNavbar();

    // Redirect if not a buyer
    const user = getUser();
    if (!user || user.role !== 'buyer') {
      window.location.href = '/pages/login.html';
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${API}/orders/mine`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });

        const data = await res.json();

        if (data.length === 0) {
          document.getElementById('orders-container').innerHTML =
            '<p>You have not placed any orders yet. <a href="/pages/products.html">Browse products</a></p>';
          return;
        }

        document.getElementById('orders-container').innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Delivery Address</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              ${data.map(o => `
                <tr>
                  <td>#${o.id}</td>
                  <td>
                    ${o.items.map(i =>
                      `${i.product_name} x${i.quantity}`
                    ).join('<br>')}
                  </td>
                  <td>₹${o.total_amount}</td>
                  <td><span class="badge badge-${o.status}">${o.status}</span></td>
                  <td>${o.delivery_address}</td>
                  <td>${new Date(o.created_at).toLocaleDateString()}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

      } catch (err) {
        document.getElementById('orders-container').innerHTML =
          '<p>Failed to load orders. Please refresh.</p>';
      }
    }

    loadOrders();
  </script>

</body>
</html>
